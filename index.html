<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>챗봇 홈</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
      }
      header {
        display: flex;
        justify-content: flex-end;
        padding: 10px 20px;
        background-color: #f5f5f5;
        border-bottom: 1px solid #ddd;
      }
      header button {
        margin-left: 10px;
        padding: 5px 10px;
        cursor: pointer;
      }
      main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      #chat-list {
        width: 250px;
        border-right: 1px solid #ddd;
        overflow-y: auto;
        padding: 10px;
        display: none;
      }
      #chat-list div {
        padding: 8px;
        cursor: pointer;
        border-radius: 5px;
      }
      #chat-list div:hover {
        background-color: #eee;
      }
      #chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      #messages {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        border-bottom: 1px solid #ddd;
        display: flex;
        flex-direction: column;
      }
      .message {
        max-width: 60%;
        margin: 5px 0;
        padding: 10px;
        border-radius: 10px;
        word-break: break-word;
      }
      .user-message {
        align-self: flex-end;
        background-color: #007bff;
        color: white;
        border-bottom-right-radius: 0;
      }
      .bot-message {
        align-self: flex-start;
        background-color: #f1f1f1;
        color: black;
        border-bottom-left-radius: 0;
      }
      #input-container {
        display: flex;
      }
      #chat-input {
        flex: 1;
        padding: 10px;
        border: none;
        outline: none;
        font-size: 16px;
      }
      #send-btn {
        padding: 10px 20px;
        border: none;
        background-color: #007bff;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header id="header"></header>
    <main>
      <div id="chat-list"></div>
      <div id="chat-container">
        <div id="messages"></div>
        <div id="input-container">
          <input
            type="text"
            id="chat-input"
            placeholder="메시지를 입력하세요..."
          />
          <button id="send-btn">전송</button>
        </div>
      </div>
    </main>

    <script>
      const headerEl = document.getElementById("header");
      const chatListEl = document.getElementById("chat-list");
      const messagesEl = document.getElementById("messages");
      const chatInputEl = document.getElementById("chat-input");
      const sendBtnEl = document.getElementById("send-btn");

      const accessToken = localStorage.getItem("accessToken");
      const refreshToken = localStorage.getItem("refreshToken");
      const urlParams = new URLSearchParams(window.location.search);
      const chatId = urlParams.get("chatId"); // 기존 채팅방인지 확인

      // ------------------------------------------
      // 공통: 성공/에러 응답 처리
      // ------------------------------------------
      async function parseResponse(res) {
        const resData = await res.json();
        if (res.ok) {
          return { ok: true, data: resData.data, message: resData.message };
        }
        return {
          ok: false,
          error: {
            status: resData.status,
            errorCode: resData.errorCode,
            errorMessage: resData.errorMessage,
            errorFields: resData.errorFields,
            redirectUri: resData.redirectUri,
          },
        };
      }

      // ------------------------------------------
      // 헤더 렌더링
      // ------------------------------------------
      function renderHeader() {
        headerEl.innerHTML = "";
        if (accessToken) {
          const logoutBtn = document.createElement("button"); // 새 HTML 요소를 생성하는 JS 코드. <button> 태그가 만들어짐
          logoutBtn.textContent = "로그아웃";
          logoutBtn.onclick = handleLogout;
          headerEl.appendChild(logoutBtn);
        } else {
          const loginBtn = document.createElement("button");
          loginBtn.textContent = "로그인";
          loginBtn.onclick = () => (window.location.href = "/login.html");
          const signupBtn = document.createElement("button");
          signupBtn.textContent = "회원가입";
          signupBtn.onclick = () => (window.location.href = "/signup.html");
          headerEl.appendChild(loginBtn);
          headerEl.appendChild(signupBtn);
        }
      }

      // ------------------------------------------
      // 채팅 목록 렌더링
      // ------------------------------------------
      function renderChatList(chats) {
        chatListEl.innerHTML = "";
        chats.forEach((chat) => {
          const item = document.createElement("div");
          item.textContent = chat.title;
          item.onclick = () =>
            (window.location.href = `index.html?chatId=${chat.id}`);
          chatListEl.appendChild(item);
        });
      }

      // ------------------------------------------
      // 메시지 렌더링
      // ------------------------------------------
      function renderMessage(text, isUser = false) {
        const msgEl = document.createElement("div");
        msgEl.className = `message ${isUser ? "user-message" : "bot-message"}`;
        msgEl.textContent = text;
        messagesEl.appendChild(msgEl);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      // ------------------------------------------
      // 채팅 목록 API
      // ------------------------------------------
      async function fetchChatList() {
        try {
          const res = await fetch("http://localhost:8080/chats/conversations", {
            headers: { Authorization: `Bearer ${accessToken}` },
          });
          const result = await parseResponse(res);
          if (!result.ok) {
            console.error(result.error);
            return [];
          }
          return result.data.conversationDtos;
        } catch (err) {
          console.error("채팅 목록 조회 오류:", err);
          return [];
        }
      }

      // ------------------------------------------
      // 기존 채팅방 메시지 조회
      // ------------------------------------------
      async function fetchChatHistory(chatId) {
        try {
          const res = await fetch(`http://localhost:8080/chats/${chatId}`, {
            headers: { Authorization: `Bearer ${accessToken}` },
          });
          const result = await parseResponse(res);
          if (!result.ok) {
            console.error(result.error);
            return;
          }
          if (result.data?.messages) {
            result.data.messages.forEach((msg) =>
              renderMessage(msg.text, msg.sender === "USER")
            );
          }
        } catch (err) {
          console.error("채팅방 메시지 조회 오류:", err);
        }
      }

      // ------------------------------------------
      // 메시지 전송
      // ------------------------------------------
      async function sendMessageToServer(prompt) {
        const isLoggedIn = !!accessToken;

        // (1) 비로그인
        if (!isLoggedIn) {
          const res = await fetch("http://localhost:8080/chats", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt }),
          });
          return parseResponse(res);
        }

        // (2) 로그인 + 신규 채팅방
        if (!chatId) {
          const res = await fetch("http://localhost:8080/chats", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${accessToken}`,
            },
            body: JSON.stringify({ prompt }),
          });
          const result = await parseResponse(res);
          if (!result.ok) return result;

          if (result.data?.chatRoomId) {
            window.location.href = `index.html?chatId=${result.data.chatRoomId}`;
          }
          return result;
        }

        // (3) 로그인 + 기존 채팅방
        const res = await fetch(`http://localhost:8080/chats/${chatId}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${accessToken}`,
          },
          body: JSON.stringify({ prompt }),
        });
        return parseResponse(res);
      }

      // ------------------------------------------
      // 로그아웃
      // ------------------------------------------
      async function handleLogout() {
        try {
          await fetch("http://localhost:8080/logout", {
            method: "POST",
            headers: { Authorization: `Bearer ${refreshToken}` },
          });
        } catch (err) {
          console.error("로그아웃 실패:", err);
        }

        localStorage.removeItem("accessToken");
        localStorage.removeItem("refreshToken");
        location.href = "index.html";
      }

      // ------------------------------------------
      // 메시지 전송 UI 처리
      // ------------------------------------------
      async function handleSendMessage() {
        const prompt = chatInputEl.value.trim();
        if (!prompt) return;

        renderMessage(prompt, true);
        chatInputEl.value = "";

        const result = await sendMessageToServer(prompt);

        if (!result.ok) {
          if (result.error.redirectUri) {
            alert(result.error.errorMessage);
            window.location.href = result.error.redirectUri;
            return;
          }
          renderMessage(result.error.errorMessage, false);
          console.error(result.error);
          return;
        }

        if (result.data?.message) renderMessage(result.data.message, false);
      }

      // ------------------------------------------
      // 초기화
      // ------------------------------------------
      async function init() {
        renderHeader();

        if (accessToken) {
          chatListEl.style.display = "block";
          const chats = await fetchChatList();
          if (chats) renderChatList(chats);

          if (chatId) await fetchChatHistory(chatId);
        }

        sendBtnEl.onclick = handleSendMessage;
        chatInputEl.addEventListener("keypress", (e) => {
          if (e.key === "Enter") handleSendMessage();
        });
      }

      init();
    </script>
  </body>
</html>
